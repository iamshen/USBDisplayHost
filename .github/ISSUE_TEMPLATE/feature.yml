name: 功能或文档建议
description: 描述使用场景、当前困难和期望改进
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么情况下遇到什么困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望改进
      description: 描述期望的行为和如何判断改进已经完成。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充信息
      description: 可选。其他解决办法、参考资料或已脱敏的截图。
