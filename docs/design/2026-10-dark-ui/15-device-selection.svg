<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='820' viewBox='0 0 1180 820'><title>USB Display 选择设备 设计稿</title>
<rect x='0' y='0' width='1180' height='820' rx='0' fill='#000000'/>
<rect x='0' y='0' width='1180' height='40' rx='0' fill='#000000'/>
<rect x='16' y='12' width='16' height='16' rx='4' fill='#E8EAED'/>
<text x='43' y='24' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='600' fill='#F3F5F7'>USB Display</text>
<text x='1046' y='25' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='16' font-weight='400' fill='#B2BBC4'>—       □       ×</text>
<rect x='72' y='86' width='30' height='2' rx='1' fill='#149CFF'/>
<text x='72' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='600' fill='#149CFF'>设备</text>
<text x='162' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>主题</text>
<text x='252' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>设备设置</text>
<text x='374' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>诊断</text>
<text x='464' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>应用设置</text>
<path d='M 0 88 L 1180 88' stroke='#292B2E'/>
<text x='72' y='135' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='26' font-weight='600' fill='#F3F5F7'>选择设备</text>
<text x='74' y='160' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>发现 2 台 · 尚未接管</text>
<rect x='888' y='44' width='220' height='36' rx='6' fill='#202124'/>
<text x='904' y='67' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#F3F5F7'>AD102  /  A01        ﹀</text>
<text x='72' y='805' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='10' font-weight='400' fill='#B2BBC4'>设计稿 v1.2 · 示例数据，非运行截图</text>
<g transform='translate(-44 40)'>
<rect x='116' y='146' width='1036' height='112' rx='8' fill='#202124'/>
<text x='140' y='194' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='24' font-weight='600' fill='#F3F5F7'>请明确选择要连接的设备</text>
<text x='140' y='230' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>发现 2 台 · 尚未接管</text>
<rect x='116' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='130' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>01  检测设备</text>
<rect x='380' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='394' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>02  选中候选</text>
<rect x='644' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='658' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>03  确认选择</text>
<rect x='908' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='922' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>04  连接设备</text>
<rect x='116' y='346' width='1036' height='228' rx='8' fill='#202124'/>
<rect x='132' y='360' width='1004' height='40' rx='8' fill='#2B2D30' stroke='#E8EAED'/>
<rect x='146' y='371' width='18' height='18' rx='3' fill='#E8EAED'/>
<text x='148' y='384' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#001525'>✓</text>
<text x='174' y='384' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>AD102 / A01   · 主题模式 · 身份可区分</text>
<rect x='146' y='419' width='18' height='18' rx='3' fill='#2B2D30' stroke='#66727C'/>
<text x='174' y='432' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>AD102 / B02   · 副屏模式 · 身份可区分</text>
<text x='140' y='472' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>已选候选：A01；选择后仍需显式连接</text>
<text x='140' y='612' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>未确认选择前，连接与所有硬件操作不可用</text>
<path d='M 116 672 L 1152 672' stroke='#363C43'/>
<text x='118' y='711' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>静态设计 · 示例状态</text>
<rect x='824' y='689' width='156' height='36' rx='8' fill='#2B2D30'/>
<text x='838' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>重新检测</text>
<rect x='996' y='689' width='156' height='36' rx='8' fill='#149CFF'/>
<text x='1010' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='600' fill='#001525'>选择设备</text>
</g>
</svg>
