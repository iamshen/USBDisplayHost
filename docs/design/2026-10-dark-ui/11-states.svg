<svg xmlns='http://www.w3.org/2000/svg' width='1180' height='820' viewBox='0 0 1180 820'><title>USB Display 操作反馈与确认 设计稿</title>
<rect x='0' y='0' width='1180' height='820' rx='0' fill='#000000'/>
<rect x='0' y='0' width='1180' height='40' rx='0' fill='#000000'/>
<rect x='16' y='12' width='16' height='16' rx='4' fill='#E8EAED'/>
