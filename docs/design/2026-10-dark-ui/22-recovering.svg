<rect x='996' y='689' width='156' height='36' rx='8' fill='#149CFF'/>
<text x='1010' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='600' fill='#001525'>停止等待</text>
