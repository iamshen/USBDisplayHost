<text x='904' y='67' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#F3F5F7'>AD102  /  A01        ﹀</text>
<text x='72' y='805' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='10' font-weight='400' fill='#B2BBC4'>设计稿 v1.2 · 示例数据，非运行截图</text>
<g transform='translate(-44 40)'>
<rect x='116' y='146' width='1036' height='112' rx='8' fill='#202124'/>
<text x='140' y='194' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='24' font-weight='600' fill='#F3F5F7'>等待原设备重新连接</text>
<text x='140' y='230' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>AD102 / A01 · 正在恢复</text>
<rect x='116' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='130' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>01  发现原设备</text>
<rect x='380' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='394' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>02  核验能力</text>
<rect x='644' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='658' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>03  恢复会话</text>
<rect x='908' y='278' width='244' height='48' rx='8' fill='#202124'/>
