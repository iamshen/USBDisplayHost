<text x='140' y='386' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>仅恢复 A01，不接管其他设备</text>
<text x='140' y='429' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>恢复已保存配置及电源意图，不重放未应用草稿</text>
<text x='140' y='472' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>若原电源意图为 Off，保持熄屏</text>
<text x='140' y='612' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>自动恢复有界；等待期间不重复发起恢复</text>
<path d='M 116 672 L 1152 672' stroke='#363C43'/>
<text x='118' y='711' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>静态设计 · 示例状态</text>
<rect x='824' y='689' width='156' height='36' rx='8' fill='#2B2D30'/>
