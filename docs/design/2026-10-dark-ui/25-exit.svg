<text x='140' y='386' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>设备切换结果待确认；错误编号：DEMO-1042</text>
<text x='140' y='429' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>继续退出仍需停止推流并等待资源安全收敛</text>
