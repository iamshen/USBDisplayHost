<text x='140' y='612' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>重试前先核实原切换结果；系统关机使用有界清理</text>
<path d='M 116 672 L 1152 672' stroke='#363C43'/>
<text x='118' y='711' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>静态设计 · 示例状态</text>
<rect x='824' y='689' width='156' height='36' rx='8' fill='#2B2D30'/>
<text x='838' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>取消退出</text>
<rect x='996' y='689' width='156' height='36' rx='8' fill='#149CFF'/>
<text x='1010' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='600' fill='#001525'>继续退出</text>
<rect x='640' y='689' width='166' height='36' rx='8' fill='#2B2D30'/>
<text x='654' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>核实后重试</text>
