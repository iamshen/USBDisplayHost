<text x='374' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>诊断</text>
<text x='464' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>应用设置</text>
<path d='M 0 88 L 1180 88' stroke='#292B2E'/>
<text x='72' y='135' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='26' font-weight='600' fill='#F3F5F7'>退出应用</text>
<text x='74' y='160' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>资源与配置确认</text>
<rect x='888' y='44' width='220' height='36' rx='6' fill='#202124'/>
<text x='904' y='67' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#F3F5F7'>AD102  /  A01        ﹀</text>
<text x='72' y='805' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='10' font-weight='400' fill='#B2BBC4'>设计稿 v1.2 · 示例数据，非运行截图</text>
<g transform='translate(-44 40)'>
<rect x='116' y='146' width='1036' height='112' rx='8' fill='#202124'/>
<text x='140' y='194' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='24' font-weight='600' fill='#F3F5F7'>退出切回副屏未完成</text>
<text x='140' y='230' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>资源与配置确认</text>
<rect x='116' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='130' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>01  处理未保存</text>
<rect x='380' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='394' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>02  切回副屏</text>
<rect x='644' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='658' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>03  收敛资源</text>
<rect x='908' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='922' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>04  退出</text>
