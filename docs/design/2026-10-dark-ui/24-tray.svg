<text x='374' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>诊断</text>
<text x='464' y='71' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#B2BBC4'>应用设置</text>
<path d='M 0 88 L 1180 88' stroke='#292B2E'/>
<text x='72' y='135' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='26' font-weight='600' fill='#F3F5F7'>托盘与窗口</text>
<text x='74' y='160' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>AD102 / A01 · 主题运行中</text>
<rect x='888' y='44' width='220' height='36' rx='6' fill='#202124'/>
<text x='904' y='67' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#F3F5F7'>AD102  /  A01        ﹀</text>
<text x='72' y='805' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='10' font-weight='400' fill='#B2BBC4'>设计稿 v1.2 · 示例数据，非运行截图</text>
<g transform='translate(-44 40)'>
<rect x='116' y='146' width='1036' height='112' rx='8' fill='#202124'/>
<text x='140' y='194' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='24' font-weight='600' fill='#F3F5F7'>窗口已收至托盘</text>
<text x='140' y='230' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>AD102 / A01 · 主题运行中</text>
<rect x='116' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='130' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>01  关闭窗口</text>
<rect x='380' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='394' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>02  保留会话</text>
<rect x='644' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='658' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>03  继续推流</text>
<rect x='908' y='278' width='244' height='48' rx='8' fill='#202124'/>
<text x='922' y='309' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#149CFF'>04  托盘操作</text>
<rect x='116' y='346' width='1036' height='228' rx='8' fill='#202124'/>
<text x='140' y='386' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>打开 USB Display</text>
<text x='140' y='429' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>切换主题（当前已是主题：禁用）／切换副屏</text>
<text x='140' y='472' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>暂停推流／恢复推流（按实际状态互斥）</text>
<text x='140' y='515' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='15' font-weight='400' fill='#B2BBC4'>退出 USB Display</text>
<text x='140' y='612' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='13' font-weight='400' fill='#B2BBC4'>托盘与主窗口共用命令门禁；熄屏、未知和忙碌状态同步限制</text>
<path d='M 116 672 L 1152 672' stroke='#363C43'/>
<text x='118' y='711' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='12' font-weight='400' fill='#B2BBC4'>静态设计 · 示例状态</text>
<rect x='824' y='689' width='156' height='36' rx='8' fill='#2B2D30'/>
<text x='838' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='400' fill='#F3F5F7'>打开窗口</text>
<rect x='996' y='689' width='156' height='36' rx='8' fill='#149CFF'/>
<text x='1010' y='712' font-family='Microsoft YaHei UI,Segoe UI,sans-serif' font-size='14' font-weight='600' fill='#001525'>暂停推流</text>
